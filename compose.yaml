services:
  subtitle-generator:
    container_name: subtitle-generator
    build:
      context: .
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /app/src
    environment:
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - 7860:7860
    tty: true
    restart: unless-stopped
    volumes:
      - ${MEDIA_FOLDER}:/media:rw
      - ${TORCH_HOME:-./models/torch}:/.cache/torch
      - ${HF_HOME:-./models/huggingface}:/.cache/huggingface
